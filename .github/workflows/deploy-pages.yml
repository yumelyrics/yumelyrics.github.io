name: Deploy 404 Isekai
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Deteksi file mana yang berubah ───────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            worker:
              - 'worker/**'
              - 'wrangler.toml'
              - '.github/workflows/deploy-pages.yml'

  # ── Job 1: Deploy Cloudflare Worker (HANYA jika worker/ berubah) ─────
  deploy-worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      worker_url: ${{ steps.deploy.outputs.url }}
      deployed: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Worker (KV + secrets + deploy)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          npx wrangler@4.120.0 secret put DISCORD_WEBHOOK_URL \
            --name isekai-discord <<< "${{ secrets.DISCORD_WEBHOOK_URL_404 }}"

          npx wrangler@4.120.0 kv namespace create "RATE_LIMIT" 2>/dev/null || true
          KV_LIST=$(npx wrangler@4.120.0 kv namespace list 2>/dev/null)
          KV_ID=$(echo "$KV_LIST" | python3 -c "
          import sys, json
          try:
              data = json.loads(sys.stdin.read())
              ns = [n for n in data if 'RATE_LIMIT' in n.get('title', '')]
              print(ns[0]['id'] if ns else '')
          except:
              print('')
          " 2>/dev/null)
          if [ -n "$KV_ID" ]; then
            grep -q 'binding = \"RATE_LIMIT\"' wrangler.toml || \
              printf '\n[[kv_namespaces]]\nbinding = \"RATE_LIMIT\"\nid = \"%s\"\n' "$KV_ID" >> wrangler.toml
            echo "✅ KV namespace dikonfigurasi: $KV_ID"
          else
            echo "⚠️  KV namespace tidak ditemukan — rate limiting nonaktif"
          fi

          DEPLOY_OUT=$(npx wrangler@4.120.0 deploy --name isekai-discord 2>&1)
          echo "$DEPLOY_OUT"
          URL=$(echo "$DEPLOY_OUT" | grep -Eo 'https://isekai-discord\.[^[:space:]]+' | head -1)
          echo "url=${URL:-https://isekai-discord.yumelyrics.workers.dev}" >> "$GITHUB_OUTPUT"

  # ── Job 2: Deploy GitHub Pages ───────────────────────────────────────
  deploy-pages:
    needs: [changes, deploy-worker]
    if: |
      always() &&
      !cancelled() &&
      (needs.deploy-worker.result == 'success' || needs.deploy-worker.result == 'skipped')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject config ke 404.html (jika pakai placeholder)
        run: |
          WORKER_URL="${{ needs.deploy-worker.outputs.worker_url }}"
          if [ -z "$WORKER_URL" ]; then
            WORKER_URL="https://isekai-discord.yumelyrics.workers.dev"
          fi
          if grep -q '__CF_WORKER_URL__' 404.html; then
            sed -i "s|__CF_WORKER_URL__|${WORKER_URL}|g" 404.html
          fi
          if grep -q '__FIREBASE_API_KEY__' 404.html; then
            sed -i \
              -e 's|__FIREBASE_API_KEY__|${{ secrets.FIREBASE_API_KEY }}|g' \
              -e 's|__FIREBASE_AUTH_DOMAIN__|${{ secrets.FIREBASE_AUTH_DOMAIN }}|g' \
              -e 's|__FIREBASE_PROJECT_ID__|${{ secrets.FIREBASE_PROJECT_ID }}|g' \
              -e 's|__FIREBASE_STORAGE_BUCKET__|${{ secrets.FIREBASE_STORAGE_BUCKET }}|g' \
              -e 's|__FIREBASE_MESSAGING_SENDER_ID__|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|g' \
              -e 's|__FIREBASE_APP_ID__|${{ secrets.FIREBASE_APP_ID }}|g' \
              404.html
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
