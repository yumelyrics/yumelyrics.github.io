name = "isekai-discord"
main = "worker/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# KV namespace untuk rate limiting
# ID diisi otomatis oleh GitHub Actions saat deploy
# (CI menambahkan blok [[kv_namespaces]] secara dinamis)

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
